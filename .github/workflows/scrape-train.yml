name: Scrape and Train

on:
    schedule:
        - cron: "0 8 * * *"
    workflow_dispatch:
        inputs:
            player_limit:
                description: "Max players to ingest"
                required: false
                default: "50"

jobs:
    pipeline:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            INGEST_PLAYER_LIMIT: ${{ github.event.inputs.player_limit || '50' }}
        steps:
            - uses: actions/checkout@v4

            - name: Require hosted DATABASE_URL
              run: |
                  if [ -z "$DATABASE_URL" ]; then
                    echo "Set the DATABASE_URL GitHub secret to the Render Postgres external URL."
                    exit 1
                  fi

            - name: Build images
              run: |
                  docker compose build migrate
                  docker compose --profile pipeline build pipeline

            - name: Run migrations
              run: docker compose run --no-deps --rm migrate

            - name: Run scrape, CV, and train
              run: docker compose --profile pipeline run --no-deps --rm pipeline

            - name: Apply Power BI views
              run: docker compose run --no-deps --rm migrate chiron-apply-views

            - name: Upload EDA artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: eda-report
                  path: artifacts/eda/
                  if-no-files-found: ignore

            - name: Upload models
              uses: actions/upload-artifact@v4
              if: success()
              with:
                  name: trained-models
                  path: models/
                  if-no-files-found: ignore
