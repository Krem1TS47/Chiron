databases:
  - name: chiron-db
    databaseName: chiron
    user: chiron
    postgresMajorVersion: "16"

services:
  - type: web
    name: chiron
    runtime: docker
    dockerfilePath: Dockerfile.api
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chiron-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
